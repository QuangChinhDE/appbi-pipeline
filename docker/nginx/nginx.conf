# Docker's embedded DNS. Upstreams are resolved per request via variables
# below, so recreating the api or frontend container does not 502 the edge
# until nginx is restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Product API/BFF. The FE never talks to the engine directly.
    location /api/ {
        set $product_api http://api:8000;
        proxy_pass         $product_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Test-connection and discover run a connector container inline; give
        # them room rather than cutting the user off at 60s.
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_buffering    off;
    }

    location = /healthz {
        set $product_api http://api:8000;
        proxy_pass $product_api/healthz;
    }

    location = /readyz {
        set $product_api http://api:8000;
        proxy_pass $product_api/readyz;
    }

    location /docs {
        set $product_api http://api:8000;
        proxy_pass $product_api$request_uri;
    }

    location = /openapi.json {
        set $product_api http://api:8000;
        proxy_pass $product_api/openapi.json;
    }

    location / {
        set $product_fe http://frontend:3000;
        proxy_pass         $product_fe$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
