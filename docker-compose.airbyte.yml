# Airbyte self-managed, pinned — the production engine.
#
# This is what `ENGINE_TYPE=AIRBYTE_API` talks to. Airbyte owns connector
# execution: job orchestration, retries, state, logs, worker isolation and
# compatibility with its own connector ecosystem. The product owns UX, policy,
# permissions, audit, scheduling and the domain model, and reaches Airbyte only
# through `IntegrationEngineAdapter`.
#
#   docker compose -f docker-compose.yml -f docker-compose.airbyte.yml up -d
#
# Two rules this file exists to enforce:
#
#   * Every image is pinned. `AIRBYTE_VERSION` is one variable so the platform
#     moves as a set; a mixed-version Airbyte is not a supported configuration.
#   * The Airbyte API is on the internal network only. The browser never talks
#     to it (guardrail 1), and nothing outside the adapter does either.
#
# Airbyte keeps its own metadata database. The product must never read it
# (guardrail 2), so it gets a separate database on the same server rather than
# sharing tables.

x-airbyte-env: &airbyte-env
  AIRBYTE_VERSION: ${AIRBYTE_VERSION:-0.59.1}
  AIRBYTE_EDITION: community
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_DB: airbyte
  DATABASE_USER: ${POSTGRES_USER:-appbi}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-appbi}
  DATABASE_URL: jdbc:postgresql://postgres:5432/airbyte
  CONFIG_DATABASE_USER: ${POSTGRES_USER:-appbi}
  CONFIG_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-appbi}
  CONFIG_DATABASE_URL: jdbc:postgresql://postgres:5432/airbyte
  # Airbyte refuses to boot if these do not match the version it ships with.
  CONFIGS_DATABASE_MINIMUM_FLYWAY_MIGRATION_VERSION: "0.40.23.002"
  JOBS_DATABASE_MINIMUM_FLYWAY_MIGRATION_VERSION: "0.29.15.001"
  TEMPORAL_HOST: airbyte-temporal:7233
  TRACKING_STRATEGY: logging
  # Connectors run as sibling containers of the Airbyte worker, on the network
  # that has no access to this product's API or database.
  WORKSPACE_ROOT: /tmp/workspace
  LOCAL_ROOT: /tmp/airbyte_local
  # These name the volume as the *host daemon* knows it, because the worker
  # passes them to `docker run` for the connector container. Compose prefixes
  # volumes with the project name, so the bare names create empty volumes
  # instead — the connector then starts and dies on a missing
  # `source_config.json`, which reads like a connector bug.
  WORKSPACE_DOCKER_MOUNT: ${COMPOSE_PROJECT_NAME:-appbi-pipeline}_airbyte_workspace
  LOCAL_DOCKER_MOUNT: ${COMPOSE_PROJECT_NAME:-appbi-pipeline}_airbyte_local
  HACK_LOCAL_ROOT_PARENT: /tmp
  JOB_MAIN_CONTAINER_CPU_REQUEST: ""
  JOB_MAIN_CONTAINER_MEMORY_REQUEST: ""
  DOCKER_NETWORK: appbi-pipeline_connectors
  # Log and state storage.
  #
  # The stock Airbyte compose runs MinIO for this, because server and worker
  # are separate containers and both have to read the same job logs: the
  # worker writes them, the server serves them to the API. Object storage is
  # how you share a filesystem between two containers that do not share one.
  #
  # These two already share one. `airbyte_workspace` is mounted at
  # /tmp/workspace in both, so LOCAL storage writes to a volume both ends can
  # see and the shared-filesystem problem MinIO solves does not exist here.
  # That is two fewer containers and ~124 MB of RAM for no lost behaviour --
  # verified by the golden path, incremental and cancel, not by reasoning.
  #
  # A deployment that splits server and worker across hosts loses that shared
  # volume and needs real object storage again: set STORAGE_TYPE to S3 and
  # point the bucket/credential variables at it.
  STORAGE_TYPE: LOCAL
  STORAGE_BUCKET_LOG: airbyte-storage
  STORAGE_BUCKET_STATE: airbyte-storage
  STORAGE_BUCKET_WORKLOAD_OUTPUT: airbyte-storage
  STORAGE_BUCKET_ACTIVITY_PAYLOAD: airbyte-storage
  MICRONAUT_ENVIRONMENTS: control-plane
  # Version note — why 0.59.1 and not something current.
  #
  # Airbyte's execution plane became Kubernetes-only, and it happened in stages.
  # Verified against the real images, not from documentation:
  #
  #   1.8.5   bootloader needs a k8s namespace for auth secrets
  #           (AB_AUTH_SECRET_CREATION_ENABLED turns that off) and then again to
  #           register a dataplane — no flag for the second one.
  #   0.64.7  bootloader, server, temporal and the Config API all run fine in
  #           Compose, but every connector job is routed through the workload
  #           launcher, which resolves `kubernetes.default.svc` and has no
  #           Docker mode. Grepping the jars finds no flag to opt out.
  #   0.59.1  predates the workload launcher entirely: zero workload jars, and
  #           the worker starts connector containers on the Docker daemon.
  #
  # So this Compose stack pins 0.59.1. It exists to certify the AIRBYTE_API
  # adapter against a real Airbyte — the Config API surface it speaks
  # (`/api/v1/sources/create`, `/scheduler/.../check_connection`,
  # `/connections/sync`, `/jobs/get`) is unchanged in later versions, so a bug
  # found here is a real bug.
  #
  # A production deployment should run a current Airbyte on Kubernetes via
  # abctl or the Helm chart. That is an infrastructure decision, and this file
  # is not a substitute for it.
  WORKER_ENVIRONMENT: docker
  CONFIG_ROOT: /data
  JOB_ERROR_REPORTING_STRATEGY: logging
  METRIC_CLIENT: ""
  WEBAPP_URL: http://localhost:8080
  # The worker calls the server back for job configuration. Without this it
  # fails dependency injection before it can register with Temporal, which
  # surfaces as a Micronaut error rather than a missing setting.
  # host:port, not a URL. This version parses the part after the colon as the
  # port, so a scheme makes it read "//airbyte-server" as a number and the
  # worker dies during dependency injection before it registers with Temporal.
  INTERNAL_API_HOST: airbyte-server:8001
  CONTAINER_ORCHESTRATOR_IMAGE: airbyte/container-orchestrator:${AIRBYTE_VERSION:-0.59.1}

services:
  # Runs Airbyte's own schema migrations, then exits. Everything else waits for
  # it: starting a server against an unmigrated database produces failures that
  # look like bugs.
  airbyte-bootloader:
    image: airbyte/bootloader:0.59.1@sha256:1e49d554da2faf3c7ae5dd6df9c36e371d8fba95abb534dd252831f1c4bdeafa
    container_name: appbi-airbyte-bootloader
    environment: *airbyte-env
    depends_on:
      postgres: {condition: service_healthy}
    networks: [appbi]
    restart: "no"

  # Airbyte's own Temporal build, not the upstream one: it ships the dynamic
  # config file Airbyte's workflows expect, and the stock temporalio image
  # exits on startup without it.
  airbyte-temporal:
    image: airbyte/temporal:0.59.1@sha256:0d4bc948762784ce300eabdfc32716cc1516d057c5f5b62610826615089b61b6
    container_name: appbi-airbyte-temporal
    environment:
      DB: postgresql
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:-appbi}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-appbi}
      # The file this image actually ships. Airbyte's published compose used
      # `development.yaml`, which does not exist here — Temporal then exits
      # before it ever listens, and every dependent service reports a DNS
      # failure that looks like a networking problem.
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    depends_on:
      postgres: {condition: service_healthy}
    # Temporal creates its own two databases and their schema on first boot.
    # Until that finishes it listens on 7233 but serves nothing, so an open
    # port is not readiness -- `tctl cluster health` is.
    healthcheck:
      # `$(hostname -i)`, not 127.0.0.1: the entrypoint sets BIND_ON_IP to the
      # container's own address, so Temporal never listens on loopback and a
      # probe there gets connection-refused from a perfectly healthy server.
      test: ["CMD-SHELL",
             "tctl --address $(hostname -i):7233 cluster health 2>/dev/null | grep -q SERVING"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    # Its schema setup is not atomic: if Postgres is still starting when it
    # runs, `create` fails and the server dies on the version check. It also
    # cannot write its own "already started" marker (the filesystem is
    # read-only there), so a restart genuinely retries the setup instead of
    # skipping it.
    restart: unless-stopped
    networks: [appbi]

  # Pin the engine's connector definitions to `connector-lock.json`.
  #
  # This is not a convenience. Airbyte 0.59.1's bootloader re-seeds its
  # connector definitions from Airbyte's *current* catalogue on every single
  # start, so an old platform comes up offering brand-new connectors it cannot
  # run. `destination-postgres` arrives as 3.x, which needs the `generationId`
  # of the refresh protocol; this platform never sends it, and the sync dies at
  # the first record with:
  #
  #     NullPointerException: getGenerationId(...) must not be null
  #
  # Nothing warns. The definition looks healthy and `check` passes. A pin
  # applied by hand is undone by the next `docker compose up`, which is how
  # this was found twice.
  airbyte-connector-pin:
    image: python:3.11-slim
    container_name: appbi-airbyte-connector-pin
    volumes:
      - ./connector-lock.json:/lock.json:ro
      - ./scripts/pin-engine-connectors.py:/pin.py:ro
    command: ["python", "/pin.py", "--lock", "/lock.json",
              "--api", "http://airbyte-server:8001"]
    depends_on:
      airbyte-server: {condition: service_healthy}
    networks: [appbi]
    restart: "no"

  # The Config API. This is the only Airbyte surface the product talks to, and
  # it is reachable on the internal network only — no host port is published.
  airbyte-server:
    image: airbyte/server:0.59.1@sha256:9ffbd4d6d53edc78ef57cf37f4af9dfc13e75d73b99d76f8c42f237a20237637
    container_name: appbi-airbyte-server
    environment:
      <<: *airbyte-env
      AIRBYTE_ROLE: server
      HTTP_IDLE_TIMEOUT: 20m
    volumes:
      - airbyte_workspace:/tmp/workspace
      - airbyte_local:/tmp/airbyte_local
    depends_on:
      airbyte-bootloader: {condition: service_completed_successfully}
      # The server opens a Temporal client during bean initialisation and exits
      # 1 if it cannot. It was missing this edge and survived on luck: the
      # storage-init -> minio chain used to delay it long enough for Temporal
      # to be up. Removing MinIO removed the delay, and the first cold start
      # after that failed with `UnknownHostException: airbyte-temporal`, which
      # reads like a network fault rather than a missing dependency.
      airbyte-temporal: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/api/v1/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
    networks: [appbi]

  # Runs the syncs. In this version the worker starts connector containers on
  # the Docker daemon directly, which is why the socket belongs here rather
  # than in the product's API and worker.
  airbyte-worker:
    image: airbyte/worker:0.59.1@sha256:68301ad94c0b083d64c653c138f79c248ebece112dad608243f90569f135749d
    container_name: appbi-airbyte-worker
    environment:
      <<: *airbyte-env
      AIRBYTE_ROLE: worker
      SYNC_JOB_MAX_ATTEMPTS: "3"
      SYNC_JOB_MAX_TIMEOUT_DAYS: "3"
    # Runs as root so it can open the Docker socket. On Docker Desktop the
    # socket is root-owned and the image's own user is not in that group, so
    # the worker starts, accepts a job, and then reports "Could not find image"
    # — the permission error never reaches the message.
    #
    # This does not widen anything: a process holding the Docker socket already
    # has root on the host. It is the reason the socket lives here and not in
    # the product's containers.
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - airbyte_workspace:/tmp/workspace
      - airbyte_local:/tmp/airbyte_local
    depends_on:
      airbyte-bootloader: {condition: service_completed_successfully}
      # Started is not ready; see the healthcheck on that service.
      airbyte-temporal: {condition: service_healthy}
    restart: unless-stopped
    networks: [appbi, connectors]

  # airbyte-cron is deliberately absent.
  #
  # Its only scheduled job in 0.59.1 is `WorkspaceCleaner`, deleting workspace
  # files older than 30 days -- and in this topology it does not even do that:
  # the workspace volume is not mounted into the cron container, so every run
  # ends in `Error invoking scheduled task ... /tmp/workspace`. It cost 513 MB
  # of RAM to throw an exception on a timer.
  #
  # It also runs the definitions updater, which refreshes connector versions
  # from Airbyte's catalogue -- the exact thing `airbyte-connector-pin` exists
  # to undo. Removing it means one less fight over which connector version runs.
  #
  # Workspace files are pruned with the volume when the stack is torn down.

  # See docs/RUNBOOK-airbyte-workspace.md.
  api:
    environment:
      ENGINE_TYPE: AIRBYTE_API
      AIRBYTE_API_URL: http://airbyte-server:8001
      AIRBYTE_WORKSPACE_ID: ${AIRBYTE_WORKSPACE_ID:-}
      AIRBYTE_WORKSPACE_AUTO: ${AIRBYTE_WORKSPACE_AUTO:-true}
    depends_on:
      airbyte-server: {condition: service_healthy}
      airbyte-connector-pin: {condition: service_completed_successfully}

  worker:
    environment:
      ENGINE_TYPE: AIRBYTE_API
      AIRBYTE_API_URL: http://airbyte-server:8001
      AIRBYTE_WORKSPACE_ID: ${AIRBYTE_WORKSPACE_ID:-}
      AIRBYTE_WORKSPACE_AUTO: ${AIRBYTE_WORKSPACE_AUTO:-true}
    depends_on:
      airbyte-server: {condition: service_healthy}
      airbyte-connector-pin: {condition: service_completed_successfully}

  migrate:
    environment:
      ENGINE_TYPE: AIRBYTE_API
      AIRBYTE_API_URL: http://airbyte-server:8001
      AIRBYTE_WORKSPACE_ID: ${AIRBYTE_WORKSPACE_ID:-}
      AIRBYTE_WORKSPACE_AUTO: ${AIRBYTE_WORKSPACE_AUTO:-true}

volumes:
  airbyte_workspace:
  airbyte_local:
