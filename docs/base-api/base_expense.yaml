    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - access_token
      - updated_from
    properties:
      access_token:
        type: string
        order: 0
        title: access_token
        airbyte_secret: true
      updated_from:
        type: number
        order: 1
        title: updated_from
    additionalProperties: true

