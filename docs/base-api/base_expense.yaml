version: 3.9.6

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - expense

definitions:
  streams:
    expense:
      type: DeclarativeStream
      name: expense
      retriever:
        type: SimpleRetriever
        paginator:
          type: DefaultPaginator
          page_size_option:
            type: RequestOption
            field_name: limit
            inject_into: body_data
          page_token_option:
            type: RequestOption
            field_name: page
            inject_into: body_data
          pagination_strategy:
            type: PageIncrement
            page_size: 500
            start_from_page: 1
            inject_on_first_request: true
        requester:
          $ref: '#/definitions/base_requester'
          path: expenses/by.time
          http_method: POST
          request_headers:
            Content-Type: application/x-www-form-urlencoded
          request_body_data:
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - items
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/expense'
    invoice:
      type: DeclarativeStream
      name: invoice
      retriever:
        type: SimpleRetriever
        paginator:
          type: DefaultPaginator
          page_size_option:
            type: RequestOption
            field_name: limit
            inject_into: body_data
          page_token_option:
            type: RequestOption
            field_name: page
            inject_into: body_data
          pagination_strategy:
            type: PageIncrement
            page_size: 100
            start_from_page: 1
            inject_on_first_request: true
        requester:
          $ref: '#/definitions/base_requester'
          path: invoices/by.time
          http_method: POST
          request_headers:
            User-Agent: >-
              Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like
              Gecko) Chrome/77.0.3865.90 Safari/537.36
            Content-Type: application/x-www-form-urlencoded
          request_body_data:
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - items
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/invoice'
      incremental_sync:
        type: DatetimeBasedCursor
        step: P1000Y
        cursor_field: last_update
        end_datetime:
          type: MinMaxDatetime
          datetime: '{{ now_utc().strftime(''%Y-%m-%dT%H:%M:%SZ'') }}'
          datetime_format: '%Y-%m-%dT%H:%M:%SZ'
        start_datetime:
          type: MinMaxDatetime
          datetime: '{{ config[''updated_from''] }}'
          datetime_format: '%s'
        datetime_format: '%s'
        start_time_option:
          type: RequestOption
          field_name: start
          inject_into: body_data
        cursor_granularity: PT1S
        cursor_datetime_formats:
          - '%s'
    outflow:
      type: DeclarativeStream
      name: outflow
      retriever:
        type: SimpleRetriever
        paginator:
          type: DefaultPaginator
          page_size_option:
            type: RequestOption
            field_name: limit
            inject_into: body_data
          page_token_option:
            type: RequestOption
            field_name: page
            inject_into: body_data
          pagination_strategy:
            type: PageIncrement
            page_size: 100
            start_from_page: 1
            inject_on_first_request: true
        requester:
          $ref: '#/definitions/base_requester'
          path: outflows/by.time
          http_method: POST
          request_headers:
            User-Agent: >-
              Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like
              Gecko) Chrome/77.0.3865.90 Safari/537.36
            Content-Type: application/x-www-form-urlencoded
          request_body_data:
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - outflows
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/outflow'
      incremental_sync:
        type: DatetimeBasedCursor
        step: P1000Y
        cursor_field: last_update
        end_datetime:
          type: MinMaxDatetime
          datetime: '{{ now_utc().strftime(''%Y-%m-%dT%H:%M:%SZ'') }}'
          datetime_format: '%Y-%m-%dT%H:%M:%SZ'
        start_datetime:
          type: MinMaxDatetime
          datetime: '{{ config[''updated_from''] }}'
          datetime_format: '%s'
        datetime_format: '%s'
        start_time_option:
          type: RequestOption
          field_name: start
          inject_into: body_data
        cursor_granularity: PT1S
        cursor_datetime_formats:
          - '%s'
  base_requester:
    type: HttpRequester
    url_base: https://expense.base.vn/extapi/v1/

