definitions:
  streams:
    test:
      type: DeclarativeStream
      name: test
      retriever:
        type: SimpleRetriever
        paginator:
          type: DefaultPaginator
          page_size_option:
            type: RequestOption
            field_name: item_per_page
            inject_into: body_data
          page_token_option:
            type: RequestOption
            field_name: page
            inject_into: body_data
          pagination_strategy:
            type: PageIncrement
            page_size: 50
            start_from_page: 1
            inject_on_first_request: true
        requester:
          $ref: '#/definitions/base_requester'
          path: ticket/get.all
          http_method: POST
          request_body_data:
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - tickets
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              stream:
                $ref: '#/definitions/streams/service'
              parent_key: id
              request_option:
                type: RequestOption
                field_name: service_id
                inject_into: body_data
              partition_field: id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/test'
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: last_update
        end_datetime:
          type: MinMaxDatetime
          datetime: '{{ now_utc().strftime(''%Y-%m-%dT%H:%M:%SZ'') }}'
          datetime_format: '%Y-%m-%dT%H:%M:%SZ'
        start_datetime:
