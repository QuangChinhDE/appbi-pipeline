version: 3.9.6

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - user

definitions:
  streams:
    user:
      type: DeclarativeStream
      name: user
      retriever:
        type: SimpleRetriever
        requester:
          $ref: '#/definitions/base_requester'
          path: users
          http_method: POST
          request_body_data:
            access_token: '{{ config["access_token"] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - users
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/user'
    group:
      type: DeclarativeStream
      name: group
      retriever:
        type: SimpleRetriever
        requester:
          $ref: '#/definitions/base_requester'
          path: units
          http_method: POST
          request_body_data:
            access_token: '{{ config["access_token"] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - units
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/group'
  base_requester:
    type: HttpRequester
    url_base: https://account.base.vn/extapi/v1/

streams:
  - $ref: '#/definitions/streams/user'
  - $ref: '#/definitions/streams/group'

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - access_token
    properties:
      access_token:
        type: string
        order: 0
        title: access_token
        airbyte_secret: true
    additionalProperties: true

metadata:
  testedStreams: {}
  autoImportSchema:
    user: true
    group: true

