version: 3.9.6

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - cycle

definitions:
  streams:
    test:
      type: DeclarativeStream
      name: test
      retriever:
        type: SimpleRetriever
        requester:
          $ref: '#/definitions/base_requester'
          path: /test
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path: []
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/test'
    cycle:
      type: DeclarativeStream
      name: cycle
      retriever:
        type: SimpleRetriever
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page
            inject_into: body_data
          pagination_strategy:
            type: PageIncrement
            page_size: 500
            start_from_page: 0
        requester:
          $ref: '#/definitions/base_requester'
          path: cycle/list
          http_method: POST
          request_headers:
            Content-Type: application/x-www-form-urlencoded
          request_body_data:
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - cycles
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/cycle'
    record:
      type: DeclarativeStream
      name: record
      retriever:
        type: SimpleRetriever
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page
            inject_into: body_data
          pagination_strategy:
            type: PageIncrement
            page_size: 500
            start_from_page: 0
        requester:
          $ref: '#/definitions/base_requester'
          path: record/list
          http_method: POST
          request_headers:
            Content-Type: application/x-www-form-urlencoded
          request_body_data:
            payroll_id: '{{ stream_partition.id }}'
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - records
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              stream:
                $ref: '#/definitions/streams/payroll'
              parent_key: id
              partition_field: id
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/record'
    payroll:
      type: DeclarativeStream
      name: payroll
      retriever:
        type: SimpleRetriever
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            field_name: page
            inject_into: body_data
          pagination_strategy:
            type: PageIncrement
            page_size: 500
            start_from_page: 0
        requester:
          $ref: '#/definitions/base_requester'
          path: payroll/list
          http_method: POST
          request_headers:
            Content-Type: application/x-www-form-urlencoded
          request_body_data:
            cycle_id: '{{ stream_partition.id }}'
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - payrolls
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              stream:
                $ref: '#/definitions/streams/cycle'
              parent_key: id
              partition_field: id
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/payroll'
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: last_update
        start_datetime:
          type: MinMaxDatetime
          datetime: '{{ config[''updated_from''] }}'
          datetime_format: '%s'
        datetime_format: '%s'
        cursor_datetime_formats:
          - '%s'
  base_requester:
    type: HttpRequester
    url_base: https://payroll.base.vn/extapi/v1

streams:
  - $ref: '#/definitions/streams/cycle'
  - $ref: '#/definitions/streams/payroll'
  - $ref: '#/definitions/streams/record'
  - $ref: '#/definitions/streams/test'

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - access_token
      - updated_from
    properties:
      access_token:
        type: string
        order: 0
        title: access_token
        airbyte_secret: true
      updated_from:
        type: number
        order: 1
        title: updated_from
    additionalProperties: true

metadata:
  testedStreams: {}
  autoImportSchema:
    test: true
    cycle: true
    record: false
    payroll: true

schemas:
  test:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    properties: {}
    additionalProperties: true
  cycle:
    type: object
    $schema: http://json-schema.org/schema#
    properties:
      id:
        type: string
      since:
        type: string
      user_id:
        type: string
      end_date:
        type: string
      schedule:
        type: string
      username:
        type: string
      system_id:
        type: string
      start_date:
        type: string
      last_update:
        type: string
      report_year:
        type: string
      report_month:
        type: string
    additionalProperties: true
  record:
    type: object
    $schema: http://json-schema.org/schema#
    properties:
      id:
        type: string
      since:
        type: string
      adjust:
        type: string
      status:
        type: string
      columns:
        type: object
      is_main:
        type: string
      user_id:
        type: string
      cycle_id:
        type: string
      schedule:
        type: string
      system_id:
        type: string
      take_home:
        type: string
      total_tax:
        type: string
      creator_id:
        type: string
      payroll_id:
        type: string
      employee_id:
        type: string
      last_update:
        type: string
      report_year:
        type: string
      cycle_export:
        type: object
        properties:
          type:
            type: string
          id:
            type: string
          path:
            type: string
          range:
            type: string
          end_date:
            type: string
          schedule:
            type: string
          start_date:
            type: string
          report_year:
            type: string
          report_month:
            type: string
      report_month:
        type: string
      total_income:
        type: string
      employee_code:
        type: string
      total_company:
        type: string
      confirm_status:
        type: string
      payroll_export:
        type: object
        properties:
          type:
            type: string
          id:
            type: string
          link:
            type: string
          name:
            type: string
          end_date:
            type: string
          start_date:
            type: string
      resolve_status:
        type: string
      total_benefits:
        type: string
      total_salaries:
        type: string
      publish_payslip:
        type: string
      total_insurance:
        type: string
      creator_username:
        type: string
      total_other_incomes:
        type: string
    additionalProperties: true
  payroll:
    type: object
    $schema: http://json-schema.org/schema#
    properties:
      id:
        type: string
      name:
        type: string
      since:
        type: string
      status:
        type: string
      is_main:
        type: string
      user_id:
        type: string
      cycle_id:
        type: string
      end_date:
        type: string
      schedule:
        type: string
      username:
        type: string
      system_id:
        type: string
      start_date:
        type: string
      last_update:
        type: string
      report_year:
        type: string
      cycle_export:
        type: object
        properties:
          type:
            type: string
          id:
            type: string
          path:
            type: string
          range:
            type: string
          end_date:
            type: string
          schedule:
            type: string
          start_date:
            type: string
          report_year:
            type: string
          report_month:
            type: string
    additionalProperties: true
