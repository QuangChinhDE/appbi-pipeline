spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - access_token
      - start_date
      - project_id
    properties:
      project_id:
        type: string
        order: 2
        title: project_id
        airbyte_secret: true
      start_date:
        type: string
        order: 1
        title: start_date
      access_token:
        type: string
        order: 0
        title: access_token
        airbyte_secret: true
    additionalProperties: true

