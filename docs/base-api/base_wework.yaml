version: 3.9.6

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - dept

definitions:
  streams:
    dept:
      type: DeclarativeStream
      name: dept
      retriever:
        type: SimpleRetriever
        requester:
          $ref: '#/definitions/base_requester'
          path: dept/list
          http_method: POST
          request_body_data:
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - depts
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/dept'
    task:
      type: DeclarativeStream
      name: task
      retriever:
        type: SimpleRetriever
        paginator:
          type: DefaultPaginator
          page_size_option:
            type: RequestOption
            field_name: limit
            inject_into: body_data
          page_token_option:
            type: RequestOption
            field_name: page
            inject_into: body_data
          pagination_strategy:
            type: PageIncrement
            page_size: 500
            start_from_page: 0
            inject_on_first_request: true
        requester:
          $ref: '#/definitions/base_requester'
          path: task/project
          http_method: POST
          request_body_data:
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - tasks
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              stream:
                $ref: '#/definitions/streams/project'
              parent_key: id
              request_option:
                type: RequestOption
                field_name: id
                inject_into: body_data
              partition_field: id
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/task'
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: last_update
        start_datetime:
          type: MinMaxDatetime
          datetime: '{{ config["start_date"] }}'
          datetime_format: '%s'
        datetime_format: '%s'
        start_time_option:
          type: RequestOption
          field_name: updated_from
          inject_into: body_data
        cursor_datetime_formats:
          - '%s'
    topic:
      type: DeclarativeStream
      name: topic
      retriever:
        type: SimpleRetriever
        requester:
          $ref: '#/definitions/base_requester'
          path: topic/list
          http_method: POST
          request_body_data:
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - topics
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              stream:
                $ref: '#/definitions/streams/project'
              parent_key: id
              request_option:
                type: RequestOption
                field_name: id
                inject_into: body_data
              partition_field: id
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/topic'
    project:
      type: DeclarativeStream
      name: project
      retriever:
        type: SimpleRetriever
        paginator:
          type: DefaultPaginator
          page_size_option:
            type: RequestOption
            field_name: items_per_page
            inject_into: body_data
          page_token_option:
            type: RequestOption
            field_name: page
            inject_into: body_data
          pagination_strategy:
            type: PageIncrement
            page_size: 500
            start_from_page: 0
            inject_on_first_request: true
        requester:
          $ref: '#/definitions/base_requester'
          path: project/get.full
          http_method: POST
          request_body_data:
            id: '131471'
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - project
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/project'
    tasklist:
      type: DeclarativeStream
      name: tasklist
      retriever:
        type: SimpleRetriever
        requester:
          $ref: '#/definitions/base_requester'
          path: project/get.full
          http_method: POST
          request_body_data:
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - tasklists
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              stream:
                $ref: '#/definitions/streams/project'
              parent_key: id
              request_option:
                type: RequestOption
                field_name: id
                inject_into: body_data
              partition_field: id
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/tasklist'
    milestone:
      type: DeclarativeStream
      name: milestone
      retriever:
        type: SimpleRetriever
        requester:
          $ref: '#/definitions/base_requester'
          path: project/get.full
          http_method: POST
          request_body_data:
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - milestones
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              stream:
                $ref: '#/definitions/streams/project'
              parent_key: id
              request_option:
                type: RequestOption
                field_name: id
                inject_into: body_data
              partition_field: id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/milestone'
  base_requester:
    type: HttpRequester
    url_base: https://wework.base.vn/extapi/v3/

streams:
  - $ref: '#/definitions/streams/dept'
  - $ref: '#/definitions/streams/project'
