version: 3.9.6

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - contact

definitions:
  streams:
    contact:
      type: DeclarativeStream
      name: contact
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: '#/definitions/base_requester'
          path: contact/list
          http_method: POST
          request_body_data:
            password: '{{ config[''password''] }}'
            service_id: '248'
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - contacts
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            inject_into: body_data
            field_name: page
          page_size_option:
            type: RequestOption
            field_name: limit
            inject_into: body_data
          pagination_strategy:
            type: PageIncrement
            page_size: 1000
            start_from_page: 1
            inject_on_first_request: true
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: last_update
        cursor_datetime_formats:
          - '%s'
        datetime_format: '%s'
        start_datetime:
          type: MinMaxDatetime
          datetime: '{{ config["updated_from"] }}'
          datetime_format: '%s'
        start_time_option:
          type: RequestOption
          field_name: last_update_stime
          inject_into: body_data
        end_time_option:
          type: RequestOption
          field_name: last_update_etime
          inject_into: body_data
        end_datetime:
          type: MinMaxDatetime
          datetime: '{{ now_utc().strftime(''%Y-%m-%dT%H:%M:%SZ'') }}'
          datetime_format: '%Y-%m-%dT%H:%M:%SZ'
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/contact'
    pipeline:
      type: DeclarativeStream
      name: pipeline
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: '#/definitions/base_requester'
          path: pipeline/all
          http_method: POST
          request_body_data:
            password: '{{ config["password"] }}'
            access_token: '{{ config["access_token"] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - pipelines
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/pipeline'
    deal:
      type: DeclarativeStream
      name: deal
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          $ref: '#/definitions/base_requester'
          path: pipeline/deals
          http_method: POST
          request_body_data:
            password: '{{ config["password"] }}'
            access_token: '{{ config["access_token"] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - deals
        paginator:
          type: DefaultPaginator
          page_token_option:
            type: RequestOption
            inject_into: body_data
            field_name: page
          page_size_option:
            type: RequestOption
            field_name: limit
            inject_into: body_data
          pagination_strategy:
            type: PageIncrement
            page_size: 1000
            start_from_page: 1
            inject_on_first_request: true
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              parent_key: id
              request_option:
                type: RequestOption
                field_name: id
                inject_into: body_data
              partition_field: id
              stream:
                $ref: '#/definitions/streams/pipeline'
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: last_update
        cursor_datetime_formats:
          - '%s'
        datetime_format: '%s'
        start_datetime:
          type: MinMaxDatetime
          datetime: '{{ config["updated_from"] }}'
          datetime_format: '%s'
        start_time_option:
          type: RequestOption
          field_name: last_update_stime
          inject_into: body_data
        end_time_option:
          type: RequestOption
          field_name: last_update_etime
          inject_into: body_data
        end_datetime:
