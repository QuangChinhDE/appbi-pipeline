version: 3.9.6

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - dept

definitions:
  streams:
    dept:
      type: DeclarativeStream
      name: dept
      retriever:
        type: SimpleRetriever
        requester:
          $ref: '#/definitions/base_requester'
          path: system/depts
          http_method: POST
          request_headers:
            Content-Type: application/x-www-form-urlencoded
          request_body_data:
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - depts
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/dept'
    pool:
      type: DeclarativeStream
      name: pool
      retriever:
        type: SimpleRetriever
        requester:
          $ref: '#/definitions/base_requester'
          path: pool/list
          http_method: POST
          request_headers:
            Content-Type: application/x-www-form-urlencoded
          request_body_data:
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - pools
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/pool'
    stage:
      type: DeclarativeStream
      name: stage
      retriever:
        type: SimpleRetriever
        paginator:
          type: DefaultPaginator
          page_size_option:
            type: RequestOption
            field_name: num_per_page
            inject_into: body_data
          page_token_option:
            type: RequestOption
            field_name: page
            inject_into: body_data
          pagination_strategy:
            type: PageIncrement
            page_size: 50
            start_from_page: 1
        requester:
          $ref: '#/definitions/base_requester'
          path: stage/list
          http_method: POST
          request_headers:
            Content-Type: application/x-www-form-urlencoded
          request_body_data:
            opening_id: '{{ stream_partition.id }}'
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - stages
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              stream:
                $ref: '#/definitions/streams/opening'
              parent_key: id
              partition_field: id
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/stage'
    office:
      type: DeclarativeStream
      name: office
      retriever:
        type: SimpleRetriever
        requester:
          $ref: '#/definitions/base_requester'
          path: system/offices
          http_method: POST
          request_headers:
            Content-Type: application/x-www-form-urlencoded
          request_body_data:
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - depts
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/office'
    contact:
      type: DeclarativeStream
      name: contact
      retriever:
        type: SimpleRetriever
        paginator:
          type: DefaultPaginator
          page_size_option:
            type: RequestOption
            field_name: num_per_page
            inject_into: body_data
          page_token_option:
            type: RequestOption
            field_name: page
            inject_into: body_data
          pagination_strategy:
            type: PageIncrement
            page_size: 50
            start_from_page: 1
        requester:
          $ref: '#/definitions/base_requester'
          path: contact/list
          http_method: POST
          request_headers:
            Content-Type: application/x-www-form-urlencoded
          request_body_data:
            pool_id: '{{ stream_partition.id }}'
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - contacts
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              stream:
                $ref: '#/definitions/streams/pool'
              parent_key: id
              partition_field: id
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/contact'
    opening:
      type: DeclarativeStream
      name: opening
      retriever:
        type: SimpleRetriever
        paginator:
          type: DefaultPaginator
          page_size_option:
            type: RequestOption
            field_name: num_per_page
            inject_into: body_data
          page_token_option:
            type: RequestOption
            field_name: page
            inject_into: body_data
          pagination_strategy:
            type: PageIncrement
            page_size: 50
            start_from_page: 1
        requester:
          $ref: '#/definitions/base_requester'
          path: opening/list
          http_method: POST
          request_headers:
            Content-Type: application/x-www-form-urlencoded
          request_body_data:
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - openings
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/opening'
    candidate:
      type: DeclarativeStream
      name: candidate
      retriever:
        type: SimpleRetriever
        paginator:
          type: DefaultPaginator
          page_size_option:
            type: RequestOption
            field_name: num_per_page
            inject_into: body_data
          page_token_option:
            type: RequestOption
            field_name: page
            inject_into: body_data
          pagination_strategy:
            type: PageIncrement
            page_size: 50
            start_from_page: 1
        requester:
          $ref: '#/definitions/base_requester'
          path: candidate/list
          http_method: POST
          request_headers:
            Content-Type: application/x-www-form-urlencoded
          request_body_data:
            opening_id: '{{ stream_partition.id }}'
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - candidates
        partition_router:
          type: SubstreamPartitionRouter
          parent_stream_configs:
            - type: ParentStreamConfig
              stream:
                $ref: '#/definitions/streams/opening'
              parent_key: id
              partition_field: id
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/candidate'
    interview:
      type: DeclarativeStream
      name: interview
      retriever:
        type: SimpleRetriever
        paginator:
          type: DefaultPaginator
          page_size_option:
            type: RequestOption
            field_name: num_per_page
            inject_into: body_data
          page_token_option:
            type: RequestOption
            field_name: page
            inject_into: body_data
          pagination_strategy:
            type: PageIncrement
            page_size: 50
            start_from_page: 1
        requester:
          $ref: '#/definitions/base_requester'
          path: interview/list
          http_method: POST
          request_headers:
            Content-Type: application/x-www-form-urlencoded
          request_body_data:
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - interviews
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/interview'
  base_requester:
    type: HttpRequester
    url_base: https://hiring.base.vn/publicapi/v2/

streams:
  - $ref: '#/definitions/streams/dept'
  - $ref: '#/definitions/streams/office'
  - $ref: '#/definitions/streams/pool'
  - $ref: '#/definitions/streams/contact'
  - $ref: '#/definitions/streams/opening'
  - $ref: '#/definitions/streams/candidate'
  - $ref: '#/definitions/streams/interview'
  - $ref: '#/definitions/streams/stage'

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - access_token
    properties:
      access_token:
        type: string
        order: 0
        title: access_token
        airbyte_secret: true
    additionalProperties: true

metadata:
  testedStreams: {}
  autoImportSchema:
    dept: true
    pool: false
    stage: false
    office: true
    contact: false
    opening: true
    candidate: false
    interview: false

