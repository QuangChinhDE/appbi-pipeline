version: 3.9.6

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - group

definitions:
  streams:
    group:
      type: DeclarativeStream
      name: group
      retriever:
        type: SimpleRetriever
        requester:
          $ref: '#/definitions/base_requester'
          path: group/list
          http_method: POST
          request_body_data:
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - groups
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/group'
    timeoff:
      type: DeclarativeStream
      name: timeoff
      retriever:
        type: SimpleRetriever
        paginator:
          type: DefaultPaginator
          page_size_option:
            type: RequestOption
            field_name: items_per_page
            inject_into: body_data
          page_token_option:
            type: RequestOption
            field_name: page
            inject_into: body_data
          pagination_strategy:
            type: PageIncrement
            page_size: 500
            start_from_page: 0
            inject_on_first_request: true
        requester:
          $ref: '#/definitions/base_requester'
          path: timeoff/list
          http_method: POST
          request_body_data:
            access_token: '{{ config[''access_token''] }}'
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - timeoffs
      primary_key:
        - id
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: '#/schemas/timeoff'
      incremental_sync:
        type: DatetimeBasedCursor
        cursor_field: last_update
        start_datetime:
          type: MinMaxDatetime
          datetime: 01/01/2020
          datetime_format: '%d/%m/%Y'
        datetime_format: '%d/%m/%Y'
        lookback_window: P1W
        start_time_option:
          type: RequestOption
          field_name: start_date_from
          inject_into: body_data
        cursor_datetime_formats:
          - '%s'
  base_requester:
    type: HttpRequester
    url_base: https://timeoff.base.vn/extapi/v1/

streams:
  - $ref: '#/definitions/streams/group'
  - $ref: '#/definitions/streams/timeoff'

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
