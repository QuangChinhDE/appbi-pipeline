[pytest]
# The suite lives in `qa/`, the application in `backend/`.
#
# Tests used to sit inside `backend/tests`, which put the thing being verified
# and the thing verifying it in one tree -- so "what does this product ship"
# could not be answered by looking at a directory. `pythonpath` is what lets
# them separate: pytest adds `backend/` to `sys.path`, so `import app` works
# from anywhere without the suite having to live inside the package.
testpaths = qa/backend
# `backend` so `import app` works; `qa/backend` so the suite's own shared
# helpers (`scratchdb`) are importable without every test file carrying a
# copy of them.
pythonpath = backend qa/backend
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
