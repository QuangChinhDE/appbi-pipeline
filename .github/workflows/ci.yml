# CI gates for the integration domain (spec section 61).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, so the AIRBYTE_API lane below runs without holding up a merge.
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Unit + structural contract tests
        working-directory: backend
        run: python -m pytest tests -q
      - name: Kubernetes manifests are valid
        run: |
          # Schema-validated offline: there is no cluster in CI, and a manifest
          # that only parses as YAML can still be rejected by the API server.
          RELEASE=https://github.com/yannh/kubeconform/releases/download/v0.6.7
          curl -sL "$RELEASE/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.30.0 deploy/kubernetes/base/*.yaml
          # The overlay is what production applies, and rendering is where the
          # interesting bugs live: a `commonLabels` transformer silently
          # rewrote the kube-dns selector in a NetworkPolicy while every
          # source-level check stayed green. Assertions on the rendered output
          # are in qa/backend/test_operations.py.
          kubectl kustomize deploy/kubernetes/base > /dev/null
          kubectl kustomize deploy/kubernetes/overlays/production \
            | ./kubeconform -strict -summary -kubernetes-version 1.30.0 -
          # Airbyte's namespace policy is a separate overlay with its own
          # placeholder CIDR. It shipped unrendered and ungated once; the
          # release gate checks it now, and so does this.
          kubectl kustomize deploy/kubernetes/airbyte/overlays/production \
            | ./kubeconform -strict -summary -kubernetes-version 1.30.0 -

      - name: Secret scan
        run: |
          # Nothing that looks like a credential may be committed.
          ! grep -rInE "(password|secret|token)\s*[:=]\s*['\"][^'\"]{8,}" \
              --include=*.py --include=*.ts --include=*.tsx \
              backend/app frontend/src \
            | grep -v "airbyte_secret" \
            | grep -v "demo_" \
            | grep -v "REPLACE_ME"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        # `next lint` with no config drops into an interactive setup prompt and
        # exits without linting -- which read as a pass in CI. The config is
        # committed now and `--max-warnings 0` means a warning cannot
        # accumulate quietly.
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        # This step had no `run` at all: an earlier edit split it and its
        # command landed on the backend audit step below, where the duplicate
        # `run` key silently replaced `pip-audit`. Two checks were disabled by
        # one bad edit, and both still reported success.
        run: npm run typecheck

      - name: i18n coverage (EN/VI parity, no hardcoded copy)
        working-directory: frontend
        run: node ../qa/audit/check-i18n.mjs src

      - name: The production bundle carries no credential
        run: |
          # A flag that hides the demo hint is not enough: Next strips the
          # branch but the string literal still ships inside the bundle, where
          # anybody can read it. The credential is sourced from the build
          # environment instead, so with nothing supplied there is nothing to
          # find. This proves that, rather than trusting it.
          npm run build
          for needle in 'Admin@12345' 'admin@appbi.local'; do
            if grep -rl "$needle" .next/ 2>/dev/null | grep -q .; then
              echo "::error::$needle is present in the production bundle"
              grep -rl "$needle" .next/ | head
              exit 1
            fi
          done
          echo "no demo credential in the built bundle"
        working-directory: frontend

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Dependency vulnerabilities (frontend, runtime only)
        working-directory: frontend
        run: |
          # Runtime dependencies only: a dev-only advisory does not ship, and
          # gating on it teaches people to pass --force, which is how a major
          # version arrives unannounced.
          npm audit --omit=dev --audit-level=high

  # Backend dependency scanning, in its own job rather than bolted onto the
  # frontend one. A backend advisory and a frontend advisory need different
  # owners, and sharing a job means one blocks the other's signal.
  backend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependency vulnerabilities (backend)
        run: |
          pip install -q pip-audit
          pip-audit -r backend/requirements.txt --strict

  engine-contract:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot the stack
        run: |
          cp .env.example .env
          python -c "import base64,os;print('SECRET_ENCRYPTION_KEY='+base64.urlsafe_b64encode(os.urandom(32)).decode())" >> .env
          docker compose up -d --build
      - name: Pull pinned connector images
        run: python scripts/pull-engine-images.py
      - name: Adapter contract suite (upgrade gate)
        run: |
          docker compose run --rm --entrypoint "" api \
            sh -c "pip install -q pytest pytest-asyncio && RUN_ENGINE_CONTRACT=1 python -m pytest tests/test_adapter_contract.py -q"
      - name: Live UAT suite
        run: |
          python qa/e2e/e2e.py --source postgres
          python qa/e2e/verify.py
      - name: Bootstrap builds the schema and leaves no drift
        run: |
          docker compose exec -T postgres psql -U appbi -d postgres \
            -c "CREATE DATABASE ci_migration_check OWNER appbi;"
          # Through `app.bootstrap`, which is what production runs -- not
          # `alembic upgrade` alone. The two diverged: startup applied its own
          # DDL after the migrations and dropped an index the models declare,
          # so a database reporting itself at head failed the drift check.
          # Calling Alembic directly could never have seen that.
          docker compose run --rm --entrypoint "" \
            -e DATABASE_URL="postgresql+asyncpg://appbi:appbi@postgres:5432/ci_migration_check" \
            -e DATABASE_URL_SYNC="postgresql+psycopg://appbi:appbi@postgres:5432/ci_migration_check" \
            -e SEED_DEMO_DATA=false \
            -e BOOTSTRAP_ADMIN_EMAIL=ci@example.com \
            -e BOOTSTRAP_ADMIN_PASSWORD="ci-Bootstrap-Secret-1" \
            api python -m app.bootstrap
          DATABASE_URL_SYNC="postgresql+psycopg://appbi:appbi@localhost:55433/ci_migration_check" \
            python scripts/check-schema-drift.py

      - name: Supply chain — version, lock, egress (repo-level)
        run: |
          pip install -q pytest pytest-asyncio pydantic pydantic-settings
          python scripts/build-connector-lock.py --verify
      - name: Adversarial API audit
        run: python qa/audit/audit-api.py
      - name: Adversarial UI audit
        working-directory: frontend
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          cp ../qa/audit/audit-ui.mjs .
          node audit-ui.mjs
      - name: Behavioural audit
        working-directory: frontend
        # Copied in: ESM resolves playwright from the script's own directory.
        run: |
          cp ../qa/audit/audit-behaviour.mjs .
          node audit-behaviour.mjs

  # The engine production actually runs on. The job above proves the adapter
  # boundary using the product's own executor; this one proves the same contract
  # against a real self-managed Airbyte, which is the only thing that can catch
  # "Airbyte disagrees with our reading of its API".
  #
  # Nightly rather than per-PR: it pulls the platform images and several
  # connectors, so it costs minutes, not seconds. A red night blocks a release,
  # not a merge.
  airbyte-api-contract:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Boot the product against a self-managed Airbyte
        run: |
          cp .env.example .env
          python -c "import base64,os;print('SECRET_ENCRYPTION_KEY='+base64.urlsafe_b64encode(os.urandom(32)).decode())" >> .env
          docker compose -f docker-compose.yml -f docker-compose.airbyte.yml up -d --build

      - name: Wait for Airbyte to accept work
        run: |
          # The bootloader migrates Airbyte's own database before the server is
          # useful, so "container started" is not the signal to wait for.
          for i in $(seq 1 60); do
            if docker exec appbi-airbyte-server curl -fsS http://localhost:8001/api/v1/health >/dev/null 2>&1; then
              echo "airbyte ready after ${i} attempts"; exit 0
            fi
            sleep 10
          done
          echo "::error::Airbyte did not become ready"
          docker compose -f docker-compose.yml -f docker-compose.airbyte.yml logs --tail 100 airbyte-server airbyte-bootloader
          exit 1

      - name: Pull the connector images this Airbyte pins
        run: |
          # Airbyte decides the tag in this mode, so the product's lock file is
          # not the list to pull from. Ask the deployment what it will run.
          docker exec appbi-airbyte-server curl -fsS -X POST \
            http://localhost:8001/api/v1/source_definitions/list \
            -H 'Content-Type: application/json' -d '{}' > sources.json
          docker exec appbi-airbyte-server curl -fsS -X POST \
            http://localhost:8001/api/v1/destination_definitions/list \
            -H 'Content-Type: application/json' -d '{}' > destinations.json
          python scripts/pull-engine-images.py sources.json destinations.json

      - name: Adapter contract suite against Airbyte
        run: |
          docker compose -f docker-compose.yml -f docker-compose.airbyte.yml \
            run --rm --entrypoint "" -e RUN_ENGINE_CONTRACT=1 api \
            sh -c "pip install -q pytest pytest-asyncio && python -m pytest tests/test_adapter_contract.py -q"

      - name: End-to-end through the product API
        run: |
          # --evidence is what the release gate reads. Without it the gate
          # refuses to record, which is the point: an artifact that asserts its
          # own evidence is not evidence.
          python qa/e2e/e2e.py --source postgres --engine airbyte-api \
            --evidence evidence-e2e.json

      - name: Egress policy holds
        run: python qa/probes/verify-egress.py

      - name: Record the certification artifact
        run: |
          # A green run that leaves no record is not a release gate: by the time
          # anyone ships, nobody can say which Airbyte, which connector versions
          # or which commit was actually proven.
          COOKIE=$(curl -s -i -X POST http://localhost:8010/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@appbi.local","password":"Admin@12345"}' \
            | grep -i '^set-cookie:' | sed 's/^[Ss]et-[Cc]ookie: //' | cut -d';' -f1)
          APPBI_COOKIE="$COOKIE" python scripts/release-gate.py record \
            --out certification.json --evidence evidence-e2e.json
          python scripts/release-gate.py check certification.json

      - name: Publish the certification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airbyte-api-certification
          path: |
            certification.json
            evidence-e2e.json
          if-no-files-found: warn

      - name: Record what failed
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.airbyte.yml \
            logs --tail 200 api worker airbyte-server airbyte-worker

  # The platform production actually runs on. The lane above certifies the
  # Config API against 0.59.1 — the last Airbyte line that shipped Compose — so
  # on its own it says nothing about 1.x, about the workload plane, or about
  # connectors running as pods. This one does.
  #
  # It is what caught /api/v1/workspaces/list returning 404 on 1.8.5.
  #
  # Scheduled rather than per-PR: it builds a cluster, installs a Helm release
  # and pulls several hundred megabytes of connector images.
