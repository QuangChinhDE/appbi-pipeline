# What a reviewer can re-run to reproduce a release claim.
#
# Everything here is offline: no warehouse, no engine, no credentials. The
# checks that need a live BigQuery or a running Airbyte are a separate,
# manually-dispatched job precisely because they cannot gate a pull request
# from a fork -- but the rules a release blocks on (a connection check that
# deletes nothing, a publish that cannot make unverified code live, an
# unattended trigger that never runs a draft) are all assertable without one,
# and they run on every push.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository; the token gets read access only.
permissions:
  contents: read

jobs:
  # Judges the pull request's diff with the guardrail *as it exists at the
  # merge base*. The head copy is never executed, so a PR that edits the
  # guardrail cannot change the rules it is judged by (backend/tests/
  # test_guardrail.py::test_a_pr_cannot_approve_its_own_weakening).
  #
  # A BLOCK is lifted only by the repository variable
  # APPBI_PROTECTION_APPROVAL_SHA equal to the exact head commit. Only a repo
  # admin can set it, and any further push changes the head and voids it.
  #
  # Pull requests only: on a push to master the change has already been judged
  # on its PR head, which is the commit the approval named.
  guardrail:
    name: Change guardrail
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Diff judged by the base revision's guardrail
        env:
          APPBI_PROTECTION_APPROVAL_SHA: ${{ vars.APPBI_PROTECTION_APPROVAL_SHA }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          BASE="$(git merge-base "$PR_BASE" "$PR_HEAD")"
          TRUSTED="$RUNNER_TEMP/guardrail.py"
          if ! git show "$BASE:scripts/guardrail.py" > "$TRUSTED" 2>/dev/null; then
            # Introducing the guardrail is itself a protection change: there is
            # no trusted copy to judge it with, so it needs owner approval.
            if [ "${APPBI_PROTECTION_APPROVAL_SHA:-}" != "$PR_HEAD" ]; then
              echo "::error::scripts/guardrail.py does not exist at the merge base $BASE. Introducing it requires APPBI_PROTECTION_APPROVAL_SHA=$PR_HEAD."
              exit 1
            fi
            echo "::notice::Bootstrap approved by the owner for $PR_HEAD; using the head copy once."
            git show "$PR_HEAD:scripts/guardrail.py" > "$TRUSTED"
          fi
          python "$TRUSTED" --repo . --base "$BASE" --head "$PR_HEAD"


  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyflakes

      # Catches the class of defect that shipped twice in this module: a name
      # that stopped existing after a refactor and was only found at runtime.
      - name: Undefined names
        working-directory: backend
        run: python -m pyflakes app

      # Same script the local `python scripts/verify.py` run executes, so a
      # green local check and a green CI lane mean the same thing.
      - name: Migrations have one head
        run: python scripts/check-migration-heads.py

      - name: Tests
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Types
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npx next lint

      - name: Build
        working-directory: frontend
        run: npm run build

  # Separate from Frontend on purpose. It installs a browser, which is slow and
  # is the one dependency here that can fail for reasons unrelated to the diff;
  # a flaky download should not take typecheck and lint down with it.
  #
  # It needs no database and no engine: the Overview flows serve payloads
  # generated from `OverviewResponse`, and `backend/tests/test_overview_e2e_fixtures.py`
  # fails if those payloads stop matching the contract. So this runs on every
  # pull request rather than on somebody's laptop with a prepared workspace.
  e2e:
    name: Overview golden flows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Overview golden flows
        working-directory: frontend
        run: npm run test:e2e:overview

      - name: Keep the trace of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: overview-e2e-trace
          path: frontend/test-results/
          retention-days: 7

  # Agent instructions, rules, skills and hook wiring are tracked; a broken
  # reference or a malformed settings.json fails no product test, so it fails
  # here. Same script `python scripts/verify.py` runs locally.
  governance:
    name: Agent config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Rules, skills, hooks and tracked files are consistent
        run: python scripts/check-agent-config.py

  alerts:
    name: Alert rules parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pyyaml
      - name: Every rule has an expression and a for
        run: python scripts/check-alert-rules.py
