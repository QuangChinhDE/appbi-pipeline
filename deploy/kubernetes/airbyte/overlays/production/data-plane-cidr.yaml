# The subnet holding the databases and warehouses connectors read and write.
#
# A JSON patch on the index rather than a strategic merge: `egress` is a list
# with no merge key, so a strategic merge would append a third rule instead of
# replacing the placeholder — leaving 10.0.0.0/24 allowed alongside the real
# subnet, which is the failure this whole overlay exists to prevent.
#
# Index 2 is the data-plane rule: 0 is DNS, 1 is Airbyte's own control plane.
- op: replace
  path: /spec/egress/2/to/0/ipBlock/cidr
  value: 10.42.9.0/26
