# Helm values used for the Airbyte 1.8.5 certification run.
#
# This is a CERTIFICATION profile, not a production one. It exists so the run
# recorded in compatibility.yaml can be reproduced exactly, and it is sized for
# a single-node kind cluster.
#
#   helm install airbyte airbyte/airbyte --version 1.8.5 \
#     -n airbyte --create-namespace --values values-certification.yaml
#
# For production, start from Airbyte's own values and change at least:
#   - auth.enabled: true               (this profile has NO authentication)
#   - postgresql.enabled: false        (point at a managed database)
#   - minio.enabled: false             (point at S3/GCS)
#   - resources                        (these are floors, not capacity)
global:
  edition: community
  auth:
    # No authentication. Acceptable only because this cluster is disposable and
    # unreachable from outside the host. The adapter supports basic auth; see
    # AIRBYTE_API_USERNAME / AIRBYTE_API_PASSWORD.
    enabled: false

# In-cluster Postgres and MinIO, so the certification does not depend on
# anything outside the cluster. Neither belongs in production: a database as a
# StatefulSet with the chart's default storage is fine for a test that is thrown
# away and is not fine for job history you intend to keep.
postgresql: {enabled: true}
minio: {enabled: true}

# The product provides its own UI and never loads Airbyte's, so the webapp is
# dead weight here — and leaving it out is also a small proof of the boundary:
# nothing in the product needs Airbyte's frontend to exist.
webapp: {enabled: false}

# Requests only, no limits: on a single-node cluster the scheduler needs room to
# place connector pods alongside the control plane, and a limit that is too low
# shows up as a sync that mysteriously never starts.
server:
  resources: {requests: {cpu: 100m, memory: 512Mi}}
worker:
  resources: {requests: {cpu: 100m, memory: 512Mi}}
workload-launcher:
  resources: {requests: {cpu: 50m, memory: 256Mi}}
temporal:
  resources: {requests: {cpu: 50m, memory: 256Mi}}
