# Airbyte on Helm chart V2, with auth enabled. This is the file that produced a
# working target topology; `values-certification.yaml` (chart V1, auth off) only
# ever proved the adapter contract.
#
#   chart 2.0.17  ->  app 1.8.5
#
# Six things this encodes, every one of which cost a failed install to learn.
# None of them are in the chart's documented values.
#
#   1. `global.auth.instanceAdmin.password` is what populates the chart's own
#      secret. The documented `passwordSecretKey` only NAMES a key and puts no
#      value in it, and `global.secrets` does not add keys at all. With the key
#      named but empty the bootloader dies in CreateContainerConfigError -- and
#      it is a Helm hook, so it is deleted on failure with nothing to inspect.
#   2. Do NOT install with `--no-hooks` to work around that. The bootloader is
#      the migration; skipping it leaves an empty schema.
#   3. `postgresql.enabled` must be false or the chart's in-cluster database
#      silently wins over the external one configured below.
#   4. The database field is `name:`, not `database:`.
#   5. Temporal defaults to requiring TLS against an external Postgres and dies
#      with `pq: SSL is not enabled on the server`. Set POSTGRES_TLS_ENABLED and
#      SQL_TLS_ENABLED to false in the env ConfigMap, or terminate TLS properly.
#   6. Do NOT hand-write `airbyte-auth-secrets`. The server creates it, with the
#      dataplane and instance-admin credentials it generates itself. Writing it
#      by hand leaves the workload-launcher unable to register its dataplane
#      (401 at DataplaneApi.initializeDataplane), which means no connector pods
#      and therefore no syncs. This was the longest-running failure in the
#      rehearsal and it was self-inflicted.
#
# The host below is a placeholder: an external database is the point.
global:
  edition: community
  airbyteUrl: http://airbyte.rc1.internal
  # No dataplane block. `controlPlane.bootstrap.dataPlane` looks like the way
  # to supply those credentials and is not: the server generates its own
  # service account regardless and publishes it into `airbyte-auth-secrets`.
  auth:
    enabled: true
    instanceAdmin:
      firstName: RC1
      lastName: Operator
      # `password` -- not `passwordSecretKey`. The documented key only NAMES a
      # key; it does not put a value in it, and `global.secrets` does not add
      # keys to the chart's secret at all. With the key named but empty the
      # bootloader dies in CreateContainerConfigError, and it is a Helm hook so
      # it is deleted on failure with nothing left to inspect.
      email: ops@acme.io
      password: REPLACE_ME
  database:
    type: external
    host: EXTERNAL_POSTGRES_HOST
    port: 5432
    name: airbyte
    user: airbyte
    secretName: airbyte-config-secrets
    passwordSecretKey: database-password
  storage:
    type: minio
# The external Postgres above is the point of this topology; the chart's
# in-cluster database must stay off or it silently wins.
postgresql:
  enabled: false
minio:
  enabled: true
webapp:
  enabled: false
server:
  resources: {requests: {cpu: 100m, memory: 512Mi}}
worker:
  resources: {requests: {cpu: 100m, memory: 512Mi}}
