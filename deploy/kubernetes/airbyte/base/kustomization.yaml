# Policy for Airbyte's namespace. Not the product's workload — see ../README.md.
#
# The base carries deliberately wrong CIDRs so that applying it unedited fails
# closed. Apply an overlay, never this.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - connector-networkpolicy.yaml
  - server-networkpolicy.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: appbi-integration
