apiVersion: apps/v1
kind: Deployment
metadata:
  name: appbi-worker
spec:
  # One replica. The worker claims runs with a database lock and enforces its
  # own concurrency limits, so a second replica is safe but buys nothing until
  # MAX_CONCURRENT_RUNS_GLOBAL is the bottleneck rather than the engine.
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: appbi-worker}
  strategy:
    # Recreate, not RollingUpdate. Two workers briefly overlapping would both
    # poll and both reconcile; the claim lock makes that correct but noisy, and
    # a sync is not so latency-sensitive that it is worth the confusion.
    type: Recreate
  template:
    metadata:
      labels: {app.kubernetes.io/name: appbi-worker}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      initContainers:
        # The same wait the API does. Without it the worker crash-loops until
        # the migration lands — observed on a real cluster: 3 restarts
        # before the schema existed. Restarts that are expected are still
        # restarts, and they train people to ignore a restart count.
        #
        # This waits using the product's own image rather than a kubectl one.
        # The kubectl approach needed an external image (`bitnami/kubectl:1.30`
        # — which does not exist; Bitnami retired those tags, and the pods sat
        # in ImagePullBackOff), a ServiceAccount, a Role and a RoleBinding, all
        # so a container could watch a Job. Asking the database whether the
        # migration landed needs none of that, and it checks the thing we
        # actually care about rather than a proxy for it.
        - name: wait-for-schema
          image: appbi-pipeline-backend
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import os, sys, time
              from alembic.config import Config
              from alembic.script import ScriptDirectory
              from sqlalchemy import create_engine, text

              # The revision this image's code expects. Read from the image
              # rather than passed in, so the two can never disagree.
              head = ScriptDirectory.from_config(
                  Config("/srv/alembic.ini")).get_current_head()
              url = os.environ["DATABASE_URL_SYNC"]
              print(f"this image expects alembic revision {head}")

              # Counting rows in alembic_version was the old check, and a
              # database at any older revision passed it instantly -- so new
              # code started against a schema it did not match, and the errors
              # read like application bugs.
              for attempt in range(180):
                  try:
                      with create_engine(url).connect() as connection:
                          current = connection.execute(
                              text("select version_num from alembic_version")
                          ).scalar()
                      if current == head:
                          print("schema is at the expected revision")
                          sys.exit(0)
                      print(f"schema is at {current!r}, waiting for {head}")
                  except Exception as exc:
                      print(f"waiting for schema: {type(exc).__name__}: {exc}")
                  time.sleep(5)
              sys.exit(
                  f"schema never reached {head}. The migration Job has not run "
                  "or has failed; check `kubectl logs job/appbi-migrate`.")
          envFrom:
            - configMapRef: {name: appbi-config}
            # No blanket secretRef. It bound whichever Secret happened to be
            # called `appbi-secrets`, so a config naming a different Secret
            # passed preflight and the Pod still read the old one. Every
            # credential is now an explicit `secretKeyRef` that the renderer
            # writes from the config -- a missing key fails the Pod instead of
            # arriving empty.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      # No Docker socket, and no way to get one. In AIRBYTE_API mode the worker
      # never starts a container: it asks Airbyte to run the sync and polls.
      containers:
        - name: worker
          image: appbi-pipeline-backend
          # Explicit, not inherited. Kubernetes picks the default from the
          # tag name — `Always` for `:latest`, `IfNotPresent` otherwise — so
          # the behaviour silently changes with how the image is tagged.
          # Version tags here are immutable; re-pushing one is the bug, not
          # something to defend against with a pull on every start.
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          env:
            - {name: SERVICE_NAME, value: product-worker}
          envFrom:
            - configMapRef: {name: appbi-config}
            # No blanket secretRef. It bound whichever Secret happened to be
            # called `appbi-secrets`, so a config naming a different Secret
            # passed preflight and the Pod still read the old one. Every
            # credential is now an explicit `secretKeyRef` that the renderer
            # writes from the config -- a missing key fails the Pod instead of
            # arriving empty.
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      # A sync in flight should finish rather than be killed mid-write. The
      # worker marks its claim released on SIGTERM; this is the grace to do it.
      terminationGracePeriodSeconds: 120
      volumes:
        - name: tmp
          emptyDir: {}
