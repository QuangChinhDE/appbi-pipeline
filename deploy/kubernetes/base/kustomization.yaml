apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: appbi

resources:
  - config.yaml
  - migrate-job.yaml
  - api.yaml
  - frontend.yaml
  - worker.yaml
  - transform-worker.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - ingress.yaml

# `labels` with includeSelectors: false, NOT `commonLabels`.
#
# commonLabels rewrites *selectors* as well as metadata, including selectors
# that point at pods this project does not own. It silently added
# `app.kubernetes.io/part-of: appbi-integration` to the kube-dns podSelector in
# networkpolicy.yaml — kube-dns has no such label, so on a cluster that
# enforces NetworkPolicy the DNS egress rule would match nothing and every
# other rule would fail looking like the destination was down.
#
# The pod selectors on the Deployments are already explicit and complete, so
# nothing here needs a selector rewritten.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: appbi-integration

# No `images:` here. The base is the shape; which registry and which tag are
# environment facts and live in an overlay, so that applying the base alone
# cannot ship an unintended image.
