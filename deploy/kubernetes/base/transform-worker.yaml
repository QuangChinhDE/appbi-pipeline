apiVersion: apps/v1
kind: Deployment
metadata:
  name: appbi-transform-worker
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: appbi-transform-worker}
  strategy:
    type: Recreate
  template:
    metadata:
      labels: {app.kubernetes.io/name: appbi-transform-worker}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      initContainers:
        - name: wait-for-schema
          image: appbi-pipeline-backend
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import os, sys, time
              from alembic.config import Config
              from alembic.script import ScriptDirectory
              from sqlalchemy import create_engine, text

              head = ScriptDirectory.from_config(
                  Config("/srv/alembic.ini")).get_current_head()
              url = os.environ["DATABASE_URL_SYNC"]
              for attempt in range(180):
                  try:
                      with create_engine(url).connect() as connection:
                          current = connection.execute(
                              text("select version_num from alembic_version")
                          ).scalar()
                      if current == head:
                          sys.exit(0)
                      print(f"schema is at {current!r}, waiting for {head}")
                  except Exception as exc:
                      print(f"waiting for schema: {type(exc).__name__}: {exc}")
                  time.sleep(5)
              sys.exit(f"schema never reached {head}")
          envFrom:
            - configMapRef: {name: appbi-config}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      containers:
        - name: transform-worker
          image: appbi-pipeline-backend
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.transform_worker"]
          env:
            - {name: SERVICE_NAME, value: transform-worker}
            - {name: HOME, value: /tmp}
            - {name: DBT_SEND_ANONYMOUS_USAGE_STATS, value: "false"}
            - {name: TRANSFORM_WORKSPACE_DIR, value: /transform/workspace}
            - {name: TRANSFORM_LOG_DIR, value: /transform/logs}
          envFrom:
            - configMapRef: {name: appbi-config}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: transform-workspace, mountPath: /transform/workspace}
            - {name: transform-logs, mountPath: /transform/logs}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
        - name: transform-workspace
          emptyDir: {sizeLimit: 4Gi}
        - name: transform-logs
          emptyDir: {sizeLimit: 2Gi}
